[package]
name = "howmany"
version = "2.1.0"
edition = "2021"
# Declared so that `cargo install` on an older toolchain says which version is
# needed instead of failing halfway through with an unresolved-method error.
# 1.82 is the floor `Option::is_none_or` sets; `cargo clippy` enforces it.
rust-version = "1.82"
authors = ["Griffin <griffin@griffin-code.com>"]
description = "A blazingly fast, intelligent code analysis tool with parallel processing, caching, and beautiful visualizations"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/GriffinCanCode/howmany"
repository = "https://github.com/GriffinCanCode/howmany"
keywords = ["code-analysis", "line-counter", "cloc", "tokei", "statistics"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
# Tests and benchmarks ship with the crate. Excluding them meant `cargo test`
# against the published package ran nothing, so a distribution packager -- or
# anyone auditing the build -- had no way to verify it.
include = [
    "src/**/*",
    "tests/**/*",
    "benches/**/*",
    "clippy.toml",
    "rustfmt.toml",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dependencies]
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
regex = "1.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.7"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.0"
crossterm = "0.29"
ratatui = "0.29"
once_cell = "1.19"
memchr = "2.7"
thiserror = "1.0"
ignore = "0.4"
indicatif = "0.17"
console = "0.15"
toml = "0.8"
dirs = "5.0"
owo-colors = "4.0"
serde-sarif = "0.8"
atty = "0.2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }

[[bin]]
name = "howmany"
path = "src/main.rs"

[[bench]]
name = "throughput"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
