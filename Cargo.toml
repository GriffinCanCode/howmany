[package]
name = "howmany"
version = "3.0.0"
edition = "2021"
# Declared so that `cargo install` on an older toolchain says which version is
# needed instead of failing halfway through with an unresolved-method error.
# Our own code only needs 1.82, the floor `Option::is_none_or` sets, but ratatui
# 0.30 and ignore 0.4.31 both require 1.88 and so decide it; `cargo clippy`
# enforces whichever is higher.
rust-version = "1.88"
authors = ["Griffin <griffin@griffin-code.com>"]
description = "A blazingly fast, intelligent code analysis tool with parallel processing, caching, and beautiful visualizations"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/GriffinCanCode/howmany"
repository = "https://github.com/GriffinCanCode/howmany"
keywords = ["code-analysis", "line-counter", "cloc", "tokei", "statistics"]
categories = ["command-line-utilities", "development-tools", "text-processing"]
# Tests and benchmarks ship with the crate. Excluding them meant `cargo test`
# against the published package ran nothing, so a distribution packager -- or
# anyone auditing the build -- had no way to verify it.
include = [
    "src/**/*",
    "tests/**/*",
    "benches/**/*",
    "clippy.toml",
    "rustfmt.toml",
    "Cargo.toml",
    "README.md",
    "LICENSE",
]

[dependencies]
# Patch-level floor: `Error::downcast_mut` is unsound before 1.0.103
# (RUSTSEC-2026-0190).
anyhow = "1.0.103"
clap = { version = "4.6", features = ["derive"] }
regex = "1.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.12"
chrono = { version = "0.4", features = ["serde"] }
tempfile = "3.27"
crossterm = "0.29"
ratatui = "0.30"
memchr = "2.8"
thiserror = "2.0"
ignore = "0.4.31"
indicatif = "0.18"
toml = "1.1"
dirs = "6.0"
owo-colors = "4.3"
serde-sarif = "0.8"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }

[[bin]]
name = "howmany"
path = "src/main.rs"

[[bench]]
name = "throughput"
harness = false

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true
