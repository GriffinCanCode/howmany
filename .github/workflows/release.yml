name: Release and Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.3.3)'
        required: true
        type: string

# Prevent concurrent release workflows
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  # The tap is a second repository, so publishing the formula depends on a token
  # that expires. When it lapsed, `update-homebrew-formula` failed on its own
  # while the tag, the binaries, and crates.io all published — v2.1.0, v2.2.0 and
  # v3.0.0 shipped with the tap frozen on v2.0.0 before anyone noticed. Checking
  # the credential before anything is published makes a lapse cost a re-run
  # instead of a version that exists everywhere except Homebrew.
  preflight:
    name: Preflight
    runs-on: ubuntu-latest
    steps:
      - name: Check the Homebrew tap credential
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN is unset. Add a token with write access to GriffinCanCode/homebrew-howmany, then re-run."
            exit 1
          fi
          # gh writes the error body and a one-line summary to stderr; the
          # summary is the last line and the only part fit for an annotation,
          # which cannot span newlines.
          if ! PUSH=$(gh api repos/GriffinCanCode/homebrew-howmany --jq .permissions.push 2>tap-err); then
            REASON=$(grep -m1 '^gh: ' tap-err || tr '\n' ' ' <tap-err)
            echo "::error::HOMEBREW_TAP_TOKEN cannot reach GriffinCanCode/homebrew-howmany -- ${REASON:-unknown error}. It has expired or lost access; rotate it, then re-run."
            exit 1
          fi
          if [ "$PUSH" != "true" ]; then
            echo "::error::HOMEBREW_TAP_TOKEN can read GriffinCanCode/homebrew-howmany but not write to it. Grant contents:write, then re-run."
            exit 1
          fi

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: preflight
    permissions:
      contents: write
      discussions: write
    outputs:
      version: ${{ steps.get_version.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Get version from tag
        id: get_version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          draft: false
          prerelease: false
          body: |
            ## Changes in ${{ steps.get_version.outputs.version }}

            - See [CHANGELOG.md](https://github.com/GriffinCanCode/howmany/blob/main/CHANGELOG.md) for detailed changes

            ## Installation

            ### Homebrew (macOS/Linux)
            ```bash
            brew install GriffinCanCode/howmany/howmany
            ```

            ### Cargo
            ```bash
            cargo install howmany
            ```

            ### From Source
            ```bash
            git clone https://github.com/GriffinCanCode/howmany.git
            cd howmany
            cargo install --path .
            ```

  build-and-test:
    name: Build and Test
    runs-on: ${{ matrix.os }}
    # Uploads binaries onto the release; the repository default is read-only.
    permissions:
      contents: write
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        rust: [stable]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo index
        uses: actions/cache@v6
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}

      - name: Cache cargo build
        uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}

      - name: Run tests
        run: cargo test --verbose

      - name: Build release
        run: cargo build --release --verbose

      # Every platform builds a file called `howmany`, so uploading under that
      # name let each leg overwrite the last and only one binary survived.
      - name: Name the binary for the platform that built it
        id: stage
        shell: bash
        run: |
          triple=$(rustc -vV | awk '/^host:/{print $2}')
          if [ "${{ runner.os }}" = "Windows" ]; then ext=".exe"; else ext=""; fi
          asset="howmany-${triple}${ext}"
          cp "target/release/howmany${ext}" "$asset"
          echo "asset=$asset" >> "$GITHUB_OUTPUT"

      - name: Upload binary
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.create-release.outputs.version }}
          files: ${{ steps.stage.outputs.asset }}

    needs: create-release

  publish-cargo:
    name: Publish to Cargo
    runs-on: ubuntu-latest
    needs: [create-release, build-and-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable

      - name: Login to crates.io
        run: cargo login ${{ secrets.CARGO_REGISTRY_TOKEN }}

      - name: Publish to crates.io
        run: cargo publish --allow-dirty

  update-homebrew-formula:
    name: Update Homebrew Formula
    runs-on: ubuntu-latest
    needs: [create-release, build-and-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Checkout homebrew-howmany
        uses: actions/checkout@v7
        with:
          repository: GriffinCanCode/homebrew-howmany
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      # `packaging/howmany.rb` is the source of truth. The tap gets a copy of it
      # with this release's url and checksum stamped in, so the published formula
      # cannot drift from the one in the crate the way it did through v2.x.
      - name: Stamp the release into the formula
        id: stamp
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          URL="https://github.com/GriffinCanCode/howmany/archive/refs/tags/${VERSION}.tar.gz"
          SHA256=$(curl -fsSL "$URL" | sha256sum | cut -d' ' -f1)
          mkdir -p homebrew-tap/Formula
          sed -e "s|^  url \".*\"|  url \"$URL\"|" \
              -e "s|^  sha256 \".*\"|  sha256 \"$SHA256\"|" \
              packaging/howmany.rb > homebrew-tap/Formula/howmany.rb
          ruby -c homebrew-tap/Formula/howmany.rb
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        run: |
          cd homebrew-tap
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add Formula/howmany.rb
          git diff --staged --quiet && exit 0
          git commit -m "howmany ${{ steps.stamp.outputs.version }}"
          git push

  notify-success:
    name: Notify Success
    runs-on: ubuntu-latest
    needs: [create-release, build-and-test, publish-cargo, update-homebrew-formula]
    if: success()
    steps:
      - name: Success notification
        run: |
          echo "🎉 Release ${{ needs.create-release.outputs.version }} completed successfully!"
          echo "✅ GitHub release created"
          echo "✅ Binaries built and uploaded"
          echo "✅ Published to crates.io"
          echo "✅ Homebrew formula updated"
