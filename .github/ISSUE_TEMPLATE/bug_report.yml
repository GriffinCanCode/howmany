name: Bug report
description: Something behaves differently than documented.
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Please fill in enough for us to reproduce it.

  - type: input
    id: version
    attributes:
      label: howmany version
      description: Output of `howmany --version`.
      placeholder: "2.1.0"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
        - Other
    validations:
      required: true

  - type: input
    id: install
    attributes:
      label: How did you install it?
      placeholder: "cargo install howmany / Homebrew / release binary / built from source"
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command you ran
      render: shell
      placeholder: howmany . --format json
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected to happen
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: What actually happened
      description: Paste the full output, including any error text.
      render: shell
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: >
        A small directory layout or file that triggers it. If the project is
        public, a link is fine.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues for a duplicate.
          required: true
        - label: I am on the latest release, or have noted why I cannot upgrade.
          required: true
